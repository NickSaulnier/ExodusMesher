[package]
name = "mesher-gui"
description = "ExodusMesher desktop front end: pick parts, run the worker, export"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "mesher-gui"
path = "src/main.rs"

[dependencies]
mesher-core.workspace = true
mesher-io.workspace = true
mesher-geom.workspace = true
mesher-client.workspace = true
serde_json.workspace = true
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
bytemuck = { version = "1.25", features = ["derive"] }
rfd = "0.18"

[dev-dependencies]
netcdf3.workspace = true
tempfile.workspace = true

[lints]
workspace = true
