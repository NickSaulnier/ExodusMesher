[package]
name = "mesher-py"
description = "Python bindings for ExodusMesher: run jobs in mesher-worker from Python"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# The extension module `mesher._mesher`; rlib too, so `cargo test` builds it.
name = "_mesher"
crate-type = ["cdylib", "rlib"]

[dependencies]
mesher-core.workspace = true
mesher-client.workspace = true
serde_json.workspace = true
pyo3 = { version = "0.30.1", features = ["abi3-py39"], optional = true }

[features]
# The Python module (`mesher._mesher`), built by maturin (which also tells
# PyO3 it builds an extension module). Off by default, so the workspace
# builds and tests without Python.
python = ["dep:pyo3"]

# The workspace's lints, but `unsafe_code` denied rather than forbidden: the
# Python module allows it, as PyO3's macros expand to unsafe code there. No
# unsafe code is written here by hand (`tests/no_unsafe.rs` checks).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "allow"
