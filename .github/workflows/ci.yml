# The regression gate: formatting, lints and the full test suite (including
# the synthetic defect suite and the TetGen oracle tests) on Linux and
# Windows, and on Linux OpenFOAM's checkMesh on every synthetic case's mesh. The Thingi10k benchmarks stay local (ignored tests): the meshes
# carry Thingiverse licences and are never committed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: GUI system libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: GUI system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      # Release: the oracle and shape tests mesh real models and are slow in
      # debug builds.
      - run: cargo test --workspace --release
      - name: Synthetic suite precision and recall
        run: cargo test --release -p mesher-synthetic -- --nocapture
      # OpenFOAM is GPL: it runs as a separate process, from OpenCFD's
      # runtime image (v2512, pinned by digest), and is never a dependency.
      - name: Synthetic meshes as OpenFOAM cases
        if: runner.os == 'Linux'
        run: SUITE_FOAM_DIR="$PWD/target/foam" cargo test --release -p mesher-synthetic --test suite
      - name: checkMesh
        if: runner.os == 'Linux'
        run: >
          docker run --rm --user "$(id -u):$(id -g)"
          -v "$PWD/target/foam:/cases" -v "$PWD/tests/foam:/check:ro"
          opencfd/openfoam-run@sha256:707421ab7d1e5201d86723945a6649490e292a0c46ed03d36982449e6b3b7243
          bash /check/check.sh /cases
      - name: checkMesh logs
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: checkmesh-logs
          path: target/foam/*/log.checkMesh
          if-no-files-found: ignore
