[workspace]
resolver = "3"
members = ["crates/*", "tests/synthetic", "tests/oracle"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/NickSaulnier/ExodusMesher"
rust-version = "1.85"

[workspace.dependencies]
mesher-geom = { path = "crates/mesher-geom" }
mesher-core = { path = "crates/mesher-core" }
mesher-io = { path = "crates/mesher-io" }
mesher-tet = { path = "crates/mesher-tet" }
mesher-fvm = { path = "crates/mesher-fvm" }
mesher-client = { path = "crates/mesher-client" }
robust = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
thiserror = "2"
rayon = "1"
clap = { version = "4", features = ["derive"] }
proptest = "1.12"
jsonschema = { version = "0.60", default-features = false }
tempfile = "3"
toml = "0.8"
netcdf3 = "0.6.1"
vtkio = "0.6.3"
mshio = "0.4.2"
tritet = { version = "3.4.0", features = ["with_tetgen"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "allow"

[profile.test]
opt-level = 1
